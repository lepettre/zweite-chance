<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zugang</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#16181D">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 6h15l9 10-9 10H4z' fill='%23FFDB00' stroke='%2316181D' stroke-width='2'/%3E%3Ccircle cx='10' cy='16' r='2.5' fill='%2316181D'/%3E%3C/svg%3E">
</head>
<body class="locked">
<div id="login" class="login" hidden>
  <form id="login-form" autocomplete="on">
    <h1>Zugang</h1>
    <label class="sr" for="login-pw">Passwort</label>
    <input id="login-pw" class="inp" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <button class="btn btn--primary" type="submit">Öffnen</button>
    <p id="login-msg" role="status"></p>
  </form>
</div>
<a class="skip" href="#view">Zum Inhalt springen</a>
<header class="masthead">
  <div class="masthead__inner">
    <a class="brand" href="#/aktuell" aria-label="Zweite-Chance-Monitor, Startseite">
      <svg class="brand__tag" viewBox="0 0 40 24" aria-hidden="true"><path d="M1 1h27l11 11-11 11H1z"/><circle cx="8" cy="12" r="2.6"/></svg>
      <span class="brand__name">Zweite&#8209;Chance&#8209;Monitor</span>
      <span class="brand__sub">IKEA Deutschland · inoffiziell</span>
    </a>
    <p class="status" id="status" aria-live="polite">Lade Daten …</p>
  </div>
  <nav class="tabs" aria-label="Hauptnavigation">
    <a href="#/aktuell" data-tab="aktuell">Aktuell <span class="tabs__n" id="n-aktuell"></span></a>
    <a href="#/archiv" data-tab="archiv">Archiv</a>
    <a href="#/merkliste" data-tab="merkliste">Merkliste <span class="tabs__n tabs__n--hit" id="n-hits"></span></a>
    <a href="#/statistik" data-tab="statistik">Statistik</a>
    <a href="#/daten" data-tab="daten">Daten &amp; Methodik</a>
  </nav>
</header>
<main id="view" tabindex="-1"></main>
<dialog id="detail" aria-labelledby="detail-title"></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<footer class="foot">
  Privates Projekt, nicht mit IKEA verbunden. Angaben ohne Gewähr – Verfügbarkeit immer bei IKEA prüfen.
</footer>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>

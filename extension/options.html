<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zweite Chance – Einstellungen</title>
<style>body{font:14px/1.5 system-ui,sans-serif;margin:0;padding:18px;width:min(460px,100%);color:#16181D;background:#F5F3EE}h1{font-size:18px;margin:0 0 12px}
label{display:block;margin:10px 0 3px;font-weight:600}input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #DFDBD1;border-radius:4px;font:inherit}
button{margin-top:12px;padding:8px 14px;border:0;border-radius:4px;background:#16181D;color:#fff;font:inherit;cursor:pointer}button.s{background:#fff;color:#16181D;border:1px solid #DFDBD1;margin-left:6px}
#msg{margin-top:12px;min-height:3em}.ok{color:#2E7D4F}.bad{color:#B5452B}small{color:#6B6F76}</style></head>
<body><h1>🏷️ Zweite Chance für IKEA</h1>
<label for="base">Adresse deiner Seite</label><input id="base" placeholder="https://lepettre.github.io/zweite-chance/">
<label for="pw">Passwort</label><input id="pw" type="password" autocomplete="off" placeholder="dein App-Passwort">
<small>Das Passwort wird nur zum Entschlüsseln benutzt; gespeichert wird ein daraus abgeleiteter Schlüssel in diesem Browser.</small><br>
<button id="save">Speichern &amp; testen</button><button class="s" id="clear">Zwischenspeicher leeren</button>
<div id="msg"></div><script src="lib.js"></script><script src="options.js"></script></body></html>

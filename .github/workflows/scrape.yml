name: Abruf

on:
  schedule:
    - cron: "*/15 * * * *"      # GitHub lässt einzelne Starts aus; alle 15 Min. anklopfen ergibt verlässlich ~stündlich.
                                # Ist der letzte Abruf jünger als min_gap_minutes (config/settings.json), endet der Lauf nach Sekunden.
  workflow_dispatch:
    inputs:
      force:
        description: "Mindestabstand ignorieren"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZC_PASSWORD: ${{ secrets.ZC_PASSWORD }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt

      - name: Passwort vorhanden?
        run: |
          [ -n "$ZC_PASSWORD" ] || { echo "::error::Secret ZC_PASSWORD fehlt (Settings > Secrets and variables > Actions)."; exit 1; }

      - name: Letzten Stand holen
        run: bash scripts/fetch_site.sh

      - name: Fällig?
        id: gap
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; else python -m tracker.run --check-gap >> "$GITHUB_OUTPUT"; fi
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gap.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Tests
        if: steps.gap.outputs.skip != 'true'
        run: |
          python -m unittest discover -s tests -t . -q
          node tests/test_core.js
          node tests/test_worker.mjs
          node tests/test_extension.js

      - name: Abruf aller Märkte
        if: steps.gap.outputs.skip != 'true'
        id: run
        run: |
          set +e
          python -m tracker.run ${{ inputs.force && '--force' || '' }}
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Veröffentlichen
        if: steps.gap.outputs.skip != 'true'
        run: bash scripts/publish.sh

      - name: Telegram senden
        if: steps.gap.outputs.skip != 'true'
        run: |
          before=$(sha256sum site/d/state.bin 2>/dev/null | cut -d' ' -f1 || true)
          python -m tracker.run --send-outbox
          after=$(sha256sum site/d/state.bin 2>/dev/null | cut -d' ' -f1 || true)
          if [ "$before" != "$after" ]; then bash scripts/publish.sh; fi

      - name: Wochensicherung (eigener Branch mit Verlauf, nichts wird gelöscht)
        if: steps.gap.outputs.skip != 'true'
        continue-on-error: true
        run: bash scripts/backup.sh

      - name: Fehlschlag melden, wenn kein Markt erreichbar war
        if: steps.run.outputs.rc == '2'
        run: |
          echo "::error::Kein Markt erreichbar (gesperrt oder Schnittstelle geändert) - siehe Log."
          exit 1

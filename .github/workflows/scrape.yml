name: Abruf

on:
  schedule:
    - cron: "23 * * * *"        # Reserve; der Cloudflare-Worker löst um :05 aus (zuverlässiger). Doppelstarts überspringt der Tracker.
  workflow_dispatch:
    inputs:
      force:
        description: "Mindestabstand ignorieren"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZC_PASSWORD: ${{ secrets.ZC_PASSWORD }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt

      - name: Passwort vorhanden?
        run: |
          [ -n "$ZC_PASSWORD" ] || { echo "::error::Secret ZC_PASSWORD fehlt (Settings > Secrets and variables > Actions)."; exit 1; }

      - name: Tests
        run: |
          python -m unittest discover -s tests -t . -q
          node tests/test_core.js
          node tests/test_worker.mjs

      - name: Letzten Stand holen
        run: bash scripts/fetch_site.sh

      - name: Abruf aller Märkte
        id: run
        run: |
          set +e
          python -m tracker.run ${{ inputs.force && '--force' || '' }}
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Veröffentlichen
        run: bash scripts/publish.sh

      - name: Telegram senden
        run: |
          before=$(sha256sum site/d/state.bin 2>/dev/null | cut -d' ' -f1 || true)
          python -m tracker.run --send-outbox
          after=$(sha256sum site/d/state.bin 2>/dev/null | cut -d' ' -f1 || true)
          if [ "$before" != "$after" ]; then bash scripts/publish.sh; fi

      - name: Altbestand aus main entfernen (einmalig)
        run: |
          if [ -f docs/data/current.json ] && [ -f site/d/meta.bin ] && [ -f site/d/watchlist.bin ]; then
            git config user.name "bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rq --ignore-unmatch docs/data state config/watchlist.json inbox
            git commit -q -m "Altbestand entfernt"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi

      - name: Fehlschlag melden, wenn kein Markt erreichbar war
        if: steps.run.outputs.rc == '2'
        run: |
          echo "::error::Kein Markt erreichbar (gesperrt oder Schnittstelle geändert) - siehe Log."
          exit 1

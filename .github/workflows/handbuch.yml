name: Handbuch

on:
  push:
    branches: [main]
    paths: ["handbuch/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-app
  cancel-in-progress: false

jobs:
  handbuch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZC_PASSWORD: ${{ secrets.ZC_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Passwort vorhanden?
        run: '[ -n "$ZC_PASSWORD" ] || { echo "::error::Secret ZC_PASSWORD fehlt."; exit 1; }'
      - name: Schlüsselpaar (nur beim ersten Mal)
        run: |
          python -m tracker.docsec keys
          if [ -n "$(git status --porcelain config)" ]; then
            git config user.name "bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/handbuch.pub config/handbuch.key.bin
            git commit -m "Handbuch: Schlüsselpaar angelegt (privater Teil verschlüsselt)"
            git push
          fi
      - name: Handbuch veröffentlichen (verschlüsselt, nur in der App lesbar)
        run: |
          if ls handbuch/*.md.enc >/dev/null 2>&1; then python -m tracker.docsec publish extra/d/handbuch.bin; fi
          bash scripts/publish.sh none

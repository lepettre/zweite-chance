name: Katalog

on:
  schedule:
    - cron: "40 2 * * *"        # täglich nachts; Sonntags zusätzlich Sitemap-Abgleich (Lücken)
  workflow_dispatch:
    inputs:
      sitemap:
        description: "Sitemap-Abgleich (Lücken) mitmachen"
        type: boolean
        default: false
      fill:
        description: "So viele Lücken-Artikel nachladen (0 = Standard 800)"
        default: "0"
      limit:
        description: "Nur die ersten N Kategorien (Probelauf, 0 = alle)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  katalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZC_PASSWORD: ${{ secrets.ZC_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      SITEMAP: ${{ inputs.sitemap }}
      FILL: ${{ inputs.fill }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Passwort vorhanden?
        run: '[ -n "$ZC_PASSWORD" ] || { echo "::error::Secret ZC_PASSWORD fehlt."; exit 1; }'
      - name: Tests
        run: python -m unittest tests.test_katalog -q
      - name: Letzten Stand holen
        run: bash scripts/fetch_site.sh
      - name: Katalog abrufen
        id: run
        run: |
          ARGS=""
          [ "${LIMIT:-0}" != "0" ] && [ -n "${LIMIT}" ] && ARGS="$ARGS --limit $LIMIT"
          F="${FILL:-0}"; { [ -z "$F" ] || [ "$F" = "0" ]; } && F=800        # täglich: Lücken aus der gespeicherten Liste nachladen
          if [ "$SITEMAP" = "true" ] || [ "$(date -u +%u)" = "7" ]; then ARGS="$ARGS --sitemap"; fi   # Sonntags: Sitemap neu einlesen
          ARGS="$ARGS --fill $F"
          echo "Argumente:$ARGS"
          set +e; python -m katalog.run $ARGS; rc=$?; set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
      - name: Veröffentlichen
        if: steps.run.outputs.rc == '0'
        run: bash scripts/publish.sh k items.bin meta.bin gaps.bin
      - name: Wochensicherung
        continue-on-error: true
        if: steps.run.outputs.rc == '0'
        run: bash scripts/backup.sh
      - name: Fehlschlag melden (gesperrt)
        if: steps.run.outputs.rc == '2'
        run: |
          echo "::error::IKEA hat den Abruf gesperrt (HTTP 403/429) - nichts gespeichert."
          exit 1

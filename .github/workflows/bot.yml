name: Abfrage

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Frage"
        required: true

permissions:
  contents: read

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZC_PASSWORD: ${{ secrets.ZC_PASSWORD }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      TEXT: ${{ inputs.text }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography
      - run: bash scripts/fetch_site.sh
      - run: python -m tracker.bot "$TEXT"
